name: On air

# The off-host "is it live?" check (ops/onair.mjs). Scheduled only, never on a push or
# pull request, so it adds no check to PRs: the required `test` check on main is
# untouched.
#
# Every 10 minutes. A check is two YouTube Data API calls of one quota unit each, four
# when the first answer is not-live and gets rechecked, so even 144 runs a day stay far
# inside the free 10,000 units. GitHub's schedule is best-effort, so expect runs to land
# late now and then.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   YOUTUBE_API_KEY     a Google Cloud API key with YouTube Data API v3 enabled
#   variable YOUTUBE_CHANNEL_ID  the channel's UC... id
# Until the variable exists the job is skipped rather than failing every half hour.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: on-air
  cancel-in-progress: false

jobs:
  on-air:
    if: vars.YOUTUBE_CHANNEL_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node ops/onair.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
